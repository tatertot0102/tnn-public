    <script type="application/ld+json" data-prerender="category">{"@context":"https://schema.org","@type":"AboutPage","name":"About TNN","description":"About Tech News Network, Brooklyn Tech's student-run broadcast journalism outlet associated with The Survey.","url":"https://bthstnn.org/about/","mainEntity":{"@type":"NewsMediaOrganization","name":"Tech News Network","alternateName":"TNN","member":[{"@type":"Person","name":"Jack Tergesen","jobTitle":"Head Anchor, Script Editor, Executive Producer, Chief Meteorologist, Marketer, Script Writer & Director","description":"Jack Tergesen is the founder of TNN. ","url":"https://bthstnn.org/staff/jack-tergesen/"},{"@type":"Person","name":"Iffat Abidah","jobTitle":"Script Writer, Anchor & Director","description":"Iffat (She/her) is a senior in Social Science Research at Brooklyn Tech. She joined the Tech News Network to engage herself within the school community by reporting local current events. She is an avid follower of politics which has influenced her passion in journalism. For her last year at tech, is excited to report on senior events to memorialize the class of 2027.","url":"https://bthstnn.org/staff/iffat-abidah/"},{"@type":"Person","name":"Isaiah Ferguson","jobTitle":"Anchor","description":"Isaiah is a senior in the electrical engineering major. He goes by he/him pronouns. He joined TNN since he cares about free journalism and enjoys reporting and working with his friends as an anchor. He believes journalism matters since a free press is essential to a free and democratic society, and in ten years he sees himself living in oman is an engineer and part time journalist.","url":"https://bthstnn.org/staff/isaiah-ferguson/"},{"@type":"Person","name":"Jayden Cunha","jobTitle":"Script Writer","description":"My name is Jayden, I'm a senior in the LAS major. I'm passionate about New York City politics and international affairs, and hope to bring these interests to TNN this year. I usually get my news from a mix of independent journalism sources, and hope to contribute towards TNN being a reliable and trusted media source for students here at Tech. Outside of school, I enjoy gaming on my desktop and listening to music.","url":"https://bthstnn.org/staff/jayden-cunha/"},{"@type":"Person","name":"Jones Hilburn","jobTitle":"Director, Script Writer & Video Editor","description":"Jones Hilburn (he/him) is a junior in the neuroscience major. He joined initially as a photographer and video editor, but soon gravitated towards script writing and journalism after watching others in TNN write and produce segments.","url":"https://bthstnn.org/staff/jones-hilburn/"},{"@type":"Person","name":"Lia Pelle","jobTitle":"Script Writer, Script Editor & Anchor","description":"Lia is in 11th grade in the LAS major. She joined tech news network as a way to expand the ways that tech students are able to access news about tech and what goes on there. Outside of TNN, she does fencing, both in and out of school.","url":"https://bthstnn.org/staff/lia-pelle/"},{"@type":"Person","name":"Matthew Roth","jobTitle":"Script Writer & Sports Anchor","description":"Matthew is a Sports Anchor for Tech News Network. He joined TNN in February 2026 because he wanted to spread views of professional athletics to the Tech community. Matthew strongly believes that Journalism is what ties the stories in communities together. Outside of Tech News Network, he can be found recording his sports podcast \"The Roth Report\", where new episodes can be found weekly on Spotify. Ultimately, this year, he is extremely excited to cover the New York Knicks, as they are coming off an NBA Finals win.","url":"https://bthstnn.org/staff/matthew-roth/"},{"@type":"Person","name":"Máximo Welter-Gomez","jobTitle":"Script Writer & Anchor","description":"Máximo Welter-Gomez (he/him) is a junior in the Social Science Research major. He joined TNN in his freshman year, because he had always had an interest in news and news production but couldn’t seem to fully get into the groove of writing articles for the Survey. When provided the opportunity to help start and join TNN, he jumped at the chance and has loved it ever since. In his free time, Máximo writes and produces music, reads, and watches Real Madrid. He believes that good journalism is one of the most important factors in keeping a healthy and stable modern society.","url":"https://bthstnn.org/staff/maximo-welter-gomez/"},{"@type":"Person","name":"Maxwell Reyfman ","jobTitle":"Script Writer & Anchor","description":"Maxwell Reyfman is a senior in the Biological Sciences Major and he joined TNN to bring the tech community together and spread school spirit. Journalism matters because it is a way to spread facts about the events in the world. Fun fact is that he has been skiing for 11 years. Outside of TNN I like to spend time with friends and surf. Volunteering in community events aligns with his interest in journalism.","url":"https://bthstnn.org/staff/maxwell-reyfman/"},{"@type":"Person","name":"Zane Wolf","jobTitle":"Executive Producer, Marketer, Tech Lead & Director","description":"Zane Wolf (he/him) is a Brooklyn Tech senior in the Electrical Engineering major and a founding member of TNN. He joined TNN to experiment with new ways of making school news engaging for students. He helps lead production, films and edits segments, and manages TNN’s website and digital systems. Outside of TNN, Zane enjoys exploring NYC and rock climbing.","url":"https://bthstnn.org/staff/zane-wolf/"},{"@type":"Person","name":"Ibrahim Chaudhri","jobTitle":"Video Editor, Director & Graphic Designer","description":"Ibrahim Chaudhri (he/him) is a senior in the Aerospace Engineering major. He joined TNN to expand on his editing skills, and gain experience in a production environment. In his free time, he has 3D art projects like animation and renders which he does in Blender.","url":"https://bthstnn.org/staff/ibrahim-chaudhri/"},{"@type":"Person","name":"Nicholas Chan","jobTitle":"Executive Marketing Director, Video Editor & Director","description":"Nicholas (he/him) is a senior in the Finance major. He joined TNN because he was interested in marketing strategy and expanding TNN’s reach and student engagement through student interviews. Outside of TNN, he enjoys playing guitar and is working on an NFL analytics model. He believes journalism matters because community awareness of real-world issues can help us design better solutions.","url":"https://bthstnn.org/staff/nicholas-chan/"},{"@type":"Person","name":"Takuo Yamamoto","jobTitle":"Executive Producer, Marketer, Executive Outreach Coordinator & Director","description":"Takuo Yamamoto is a senior in the Aerospace Engineering major. He co-founded Tech News Network to make student journalism more engaging, lead the production and behind-the-scenes work of student media. His favorite journalist is Christiane Amanpour, I think she’s very inspiring and courageous. Outside of TNN, he enjoys airplanes, boats and biking.","url":"https://bthstnn.org/staff/takuo-yamamoto/"},{"@type":"Person","name":"Annarose Grizzle","jobTitle":"Script Editor, Head Anchor, Script Writer & Director","description":"Annarose is a senior in the SSR major. She joined TNN because she loves chasing investigative stories and being an anchor. Outside of TNN, she enjoys writing and editing at The Survey.","url":"https://bthstnn.org/staff/annarose-grizzle/"},{"@type":"Person","name":"Alex Wolfowitz","jobTitle":"Executive Marketing Director, Anchor & Director","description":"Alex(He/Him) is a junior in the Civil Engineering major. He joined Tech News Network because he was interested in video journalism as well as conducting interviews. He believes journalism matters because it can shine a light on underrepresented perspectives. In 10 years, he sees himself working on a high-speed rail project somewhere in the world.","url":"https://bthstnn.org/staff/alex-wolfowitz/"},{"@type":"Person","name":"Eric Law","jobTitle":"Graphic Designer, Director & Video Editor","description":"Eric Law is a rising senior at Brooklyn Technical High School in the Neuroscience major. He joined TNN to work on his video editing and journalism skills. In the future he hopes to work on more long term/long form projects for TNN.","url":"https://bthstnn.org/staff/eric-law/"},{"@type":"Person","name":"Henry Berlach","jobTitle":"Script Writer & Head Sports Anchor","description":"Henry (He/him) is a senior in the Law and Society major and the Head of the Sports Department. He joined TNN to connect the school community through sports and build relationships between students through debate. I started debating against professional athletes for Overtime outside of school, and thought it was a great experience that I could bring to the school community. My go-to news sources are NBC and CNN, and I hope to make sure that every single student has an involvement in TNN sports debates this year.","url":"https://bthstnn.org/staff/henry-berlach/"},{"@type":"Person","name":"Aanya Misra","jobTitle":"Video Editor & Marketer","description":"Aanya is a sophomore at tech. She joined the Tech News Network due to her passion for journalism and media and her desire to spread news around tech and the broader community through different forms of media. Outside of TNN, Aanya is on the parliamentary debate team and loves to hang out with her friends, read and does taekwondo. Aanya is excited to get to help TNN fulfill its mission and be a party of making it happen this year!","url":"https://bthstnn.org/staff/aanya-misra/"}]}}</script>
